<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .card {
            padding: 60px 30px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
        }

        .primary {
            background: #2563eb;
        }

        .secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }

            p {
                font-size: 16px;
            }

            .card {
                padding: 45px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                B
            </div>

            <h1>Welcome to <span>My Website</span></h1>

            <p>
                This website is hosted completely free using GitHub Pages.
                You can customize this page and add your own content,
                images, buttons and animations.
            </p>

            <div class="buttons">
                <a href="https://github.com/" class="btn primary">
                    GitHub
                </a>

                <a href="#" class="btn secondary">
                    Explore
                </a>
            </div>

        </div>

        <div class="footer">
            © 2026 My Website · Powered by GitHub Pages
        </div>

    </div>

</body>
</html>
